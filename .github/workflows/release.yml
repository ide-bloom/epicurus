name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Use clang for ARM64 C code
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - run: cargo build --release --locked --target ${{ matrix.target }} -p epicurus-cli
      - name: Package
        shell: pwsh
        run: |
          $name = "epicurus-${{ github.ref_name }}-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/epicurus.exe" "dist/$name/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zip-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: publish
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zip-*
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        shell: bash
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS
          cd ..
          version="${GITHUB_REF_NAME#v}"
          # The section for this version in CHANGELOG.md, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \[" v "\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG section for $version" >&2; exit 1; fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: notes.md
          files: |
            dist/*.zip
            dist/SHA256SUMS
