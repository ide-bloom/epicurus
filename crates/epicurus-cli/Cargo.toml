[package]
name = "epicurus-cli"
description = "Epicurus: an open-source Windows tripwire that catches infostealers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "epicurus"
path = "src/main.rs"

[features]
# Admin-only end-to-end tests (ETW session, oplocks, suspension). Run on CI Windows runners.
integration = []

[dependencies]
epicurus-core.workspace = true
epicurus-sensor.workspace = true
epicurus-service.workspace = true
epicurus-ui.workspace = true
anyhow.workspace = true
rand.workspace = true
tokio.workspace = true
clap.workspace = true
serde_json.workspace = true
time.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
