plausibility = { age_days = [10, 200] }
content = { kind = "text", template = '''{"github.com:Iv1.b507a08c87ecfe98":{"user":"{{user}}","oauth_token":"{{token}}","githubAppId":"Iv1.b507a08c87ecfe98"}}''' }

[[decoy]]
id = "openclaw-config"
category = "ai_agent"
group = "openclaw"
description = "OpenClaw-style agent gateway config with channel tokens (~/.openclaw/openclaw.json)"
targets = [
  '%USERPROFILE%\.openclaw\openclaw.json',
  '%USERPROFILE%\.clawdbot\clawdbot.json',
  '%USERPROFILE%\.openclaw\openclaw.json.bak',
]
installed_if = ['%USERPROFILE%\.openclaw\openclaw.json']
fields = { gateway_token = "hex:48", telegram = "telegram_bot_token", discord = "discord_token" }
plausibility = { age_days = [5, 90] }
content = { kind = "text", template = '''{
  "gateway": {
    "mode": "local",
    "port": 18789,
    "bind": "loopback",
    "auth": { "mode": "token", "token": "{{gateway_token}}" }
  },
  "channels": {
    "telegram": { "enabled": true, "botToken": "{{telegram}}", "dmPolicy": "pairing" },
    "discord": { "enabled": true, "token": "{{discord}}" }
  },
  "agents": {
    "defaults": { "workspace": "~/.openclaw/workspace", "model": { "primary": "anthropic/claude-sonnet" } }
  }
}
''' }

[[decoy]]
id = "openclaw-auth-profiles"
category = "ai_agent"
group = "openclaw"
description = "OpenClaw-style agent model auth profiles with provider API keys"
targets = [
  '%USERPROFILE%\.openclaw\agents\main\agent\auth-profiles.json',
  '%USERPROFILE%\.clawdbot\agents\main\agent\auth-profiles.json',
]
installed_if = ['%USERPROFILE%\.openclaw\agents']
plausibility = { age_days = [5, 90] }
content = { kind = "text", template = '''{
  "version": 1,
  "profiles": {
    "anthropic:default": { "type": "api_key", "provider": "anthropic", "key": "{{anthropic_key}}" },
    "openai:default": { "type": "api_key", "provider": "openai", "key": "{{openai_key}}" }
  }
}
''' }

