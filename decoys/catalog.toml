] }

[[decoy]]
id = "gemini-oauth"
category = "ai_agent"
description = "Gemini CLI OAuth credentials (~/.gemini/oauth_creds.json)"
targets = [
  '%USERPROFILE%\.gemini\oauth_creds.json',
  '%USERPROFILE%\.gemini\oauth_creds.json.bak',
  '%USERPROFILE%\.gemini-old\oauth_creds.json',
]
installed_if = ['%USERPROFILE%\.gemini\oauth_creds.json']
fields = { access = "google_oauth_access", refresh = "google_oauth_refresh", id_token = "jwt", expiry = "epoch_ms_future" }
plausibility = { age_days = [1, 30] }
content = { kind = "text", template = '''{
  "access_token": "{{access}}",
  "scope": "https://www.googleapis.com/auth/cloud-platform https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile openid",
  "token_type": "Bearer",
  "id_token": "{{id_token}}",
