  "refresh_token": "{{refresh}}"
}
''' }

[[decoy]]
id = "copilot-apps"
category = "ai_agent"
description = "GitHub Copilot OAuth token store (github-copilot/apps.json)"
targets = [
  '%LOCALAPPDATA%\github-copilot\apps.json',
  '%LOCALAPPDATA%\github-copilot\hosts.json',
  '%LOCALAPPDATA%\github-copilot\apps.json.bak',
]
installed_if = ['%LOCALAPPDATA%\github-copilot\apps.json', '%LOCALAPPDATA%\github-copilot\hosts.json']
