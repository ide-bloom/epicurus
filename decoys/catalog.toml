# Epicurus default decoy catalog.
#
# Embedded into epicurus.exe at compile time. Extend or override it with TOML
# files in %ProgramData%\Epicurus\catalog.d\ (same schema; an entry with the
# same id replaces this one, `disabled = true` removes it).
#
# Rules this file must follow (enforced by tests):
# * Every secret is a {{placeholder}} filled by a generator at plant time.
#   Never write a token-shaped literal here.
# * Every path starts with %USERPROFILE%\, %APPDATA%\ or %LOCALAPPDATA%\.
#
# See docs/decoy-catalog.md for the full schema.

schema_version = 1

[profiles]
default = ["*"]
ai = ["ai_agent", "mcp"]
developer = ["ai_agent", "mcp", "cloud"]
minimal = ["ai_agent", "cloud"]

[sets]
users = ["jdoe", "mkim", "aschmidt", "rpatel", "lnguyen", "dcosta", "ehansen", "tmorales", "kwalsh", "sobrien"]
domains = ["gmail.com", "outlook.com", "proton.me", "fastmail.com"]
work_domains = ["northwind-labs.io", "contoso-dev.com", "fabrikam.tech", "tailspin.io", "adatum.dev"]
internal_domains = ["corp.internal", "prod.internal", "svc.cluster.local", "int.example.net"]
hosts = ["devbox", "ws", "laptop", "build", "dev-vm"]
companies = ["Northwind Labs", "Contoso Dev", "Fabrikam", "Tailspin", "Adatum"]
projects = ["billing-api-legacy", "payments-service-old", "invoice-worker-v1", "ledger-sync-archive", "checkout-api-2023", "auth-gateway-legacy"]
ssh_dirs = ["old", "backup", "archive", "legacy", "prev"]
chromium_profiles = ["Profile 5", "Profile 6", "Profile 7", "Profile 8", "Profile 9"]
chromium_profiles_alt = ["Profile 11", "Profile 12", "Profile 13", "Profile 14", "Profile 15"]
profile_names = ["Work", "Client", "Staging", "Personal 2", "Testing"]
regions = ["us-east-1", "us-west-2", "eu-west-1", "eu-central-1", "ap-southeast-2"]
aws_profiles = ["prod-admin", "billing", "deploy", "terraform", "legacy"]
db_users = ["app_rw", "billing_svc", "admin", "postgres", "reporting"]
db_hosts = ["pg-primary", "db-prod-01", "billing-db", "pg-main", "rds-legacy"]
db_names = ["billing", "payments", "ledger", "app_production", "core"]
gcp_projects = ["billing-prod-4471", "platform-core-2291", "data-pipeline-0937", "api-gateway-5520"]
k8s_clusters = ["prod-eu", "prod-us", "staging", "platform", "aks-main"]
registries = ["northwindcr", "contosoacr", "fabrikamreg", "tailspincr"]
npm_scopes = ["northwind", "contoso", "fabrikam", "tailspin", "adatum"]

[snippets]
mcp_servers_json = '''
    "github": {
      "command": "npx",
      "args": ["-y", "@modelcontextprotocol/server-github"],
      "env": {
        "GITHUB_PERSONAL_ACCESS_TOKEN": "{{gh_token}}"
      }
    },
    "slack": {
      "command": "npx",
      "args": ["-y", "@modelcontextprotocol/server-slack"],
      "env": {
        "SLACK_BOT_TOKEN": "{{slack_token}}",
        "SLACK_TEAM_ID": "T{{slack_team|upper}}"
      }
    },
    "notion": {
      "command": "npx",
      "args": ["-y", "@notionhq/notion-mcp-server"],
      "env": {
        "NOTION_TOKEN": "{{notion_token}}"
      }
    },
    "postgres": {
      "command": "npx",
      "args": [
        "-y",
        "@modelcontextprotocol/server-postgres",
        "postgresql://{{pg_user}}:{{pg_password}}@{{pg_host}}.{{internal_domain}}:5432/{{pg_db}}"
      ]
    },
    "stripe": {
      "command": "npx",
      "args": ["-y", "@stripe/mcp", "--tools=all", "--api-key={{stripe_key}}"]
    }'''

mcp_servers_toml = '''
[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "{{gh_token}}" }

[mcp_servers.slack]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-slack"]
env = { SLACK_BOT_TOKEN = "{{slack_token}}", SLACK_TEAM_ID = "T{{slack_team|upper}}" }

[mcp_servers.notion]
command = "npx"
args = ["-y", "@notionhq/notion-mcp-server"]
env = { NOTION_TOKEN = "{{notion_token}}" }

[mcp_servers.postgres]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-postgres", "postgresql://{{pg_user}}:{{pg_password}}@{{pg_host}}.{{internal_domain}}:5432/{{pg_db}}"]

[mcp_servers.stripe]
command = "npx"
args = ["-y", "@stripe/mcp", "--tools=all", "--api-key={{stripe_key}}"]
'''

# ---------------------------------------------------------------------------
# Groups: fields shared by several decoys.
# ---------------------------------------------------------------------------

[groups.mcp]
fields = { gh_token = "github_pat", slack_token = "slack_bot_token", slack_team = "alnum:10", notion_token = "notion_token", pg_user = "pick:db_users", pg_password = "alnum:24", pg_host = "pick:db_hosts", pg_db = "pick:db_names", internal_domain = "pick:internal_domains", stripe_key = "stripe_secret_key" }

[groups.project]
fields = { project = "pick:projects", gh_token = "github_pat", slack_token = "slack_bot_token", slack_team = "alnum:10", notion_token = "notion_token", pg_user = "pick:db_users", pg_password = "alnum:24", pg_host = "pick:db_hosts", pg_db = "pick:db_names", internal_domain = "pick:internal_domains", stripe_key = "stripe_secret_key", gcp_project = "pick:gcp_projects" }

[groups.openclaw]
fields = { anthropic_key = "anthropic_api_key", openai_key = "openai_api_key" }

[groups.azure]
fields = { tenant = "uuid", subscription = "uuid", user = "username", work_domain = "pick:work_domains", company = "pick:companies" }

[groups.ssh]
fields = { sshdir = "pick:ssh_dirs", key = "ssh_ed25519" }

[groups.chrome]
fields = { profile = "pick:chromium_profiles", profile_alt = "pick:chromium_profiles_alt", user = "username", work_domain = "pick:work_domains" }
require_any = ['%LOCALAPPDATA%\Google\Chrome\User Data']

[groups.edge]
fields = { profile = "pick:chromium_profiles", profile_alt = "pick:chromium_profiles_alt", user = "username", work_domain = "pick:work_domains" }
require_any = ['%LOCALAPPDATA%\Microsoft\Edge\User Data']

[groups.brave]
fields = { profile = "pick:chromium_profiles", profile_alt = "pick:chromium_profiles_alt", user = "username", work_domain = "pick:work_domains" }
require_any = ['%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data']

[groups.exodus]
skip_if_any = ['%APPDATA%\Exodus']

[groups.telegram]

# ---------------------------------------------------------------------------
# AI coding agents and assistants
# ---------------------------------------------------------------------------

[[decoy]]
id = "claude-code-credentials"
category = "ai_agent"
description = "Claude Code OAuth credentials (~/.claude/.credentials.json)"
targets = [
  '%USERPROFILE%\.claude\.credentials.json',
  '%USERPROFILE%\.claude\.credentials.json.bak',
  '%USERPROFILE%\.claude-old\.credentials.json',
]
installed_if = ['%USERPROFILE%\.claude\.credentials.json']
fields = { access = "anthropic_oauth_access", refresh = "anthropic_oauth_refresh", expires = "epoch_ms_future" }
plausibility = { age_days = [3, 40], hidden = false }
content = { kind = "text", template = '''{"claudeAiOauth":{"accessToken":"{{access}}","refreshToken":"{{refresh}}","expiresAt":{{expires}},"scopes":["user:inference","user:profile","user:sessions:claude_code"],"subscriptionType":"max","rateLimitTier":"default_claude_max_20x"}}''' }

[[decoy]]
id = "claude-code-config"
category = "ai_agent"
group = "mcp"
description = "Claude Code global config with MCP servers and account (~/.claude.json)"
targets = [
  '%USERPROFILE%\.claude.json',
  '%USERPROFILE%\.claude\backups\.claude.json.backup',
  '%USERPROFILE%\.claude-old\.claude.json',
]
installed_if = ['%USERPROFILE%\.claude.json']
fields = { user_id = "hex:64", account = "uuid", org = "uuid", email = "email", startups = "int:40:900" }
plausibility = { age_days = [2, 30] }
content = { kind = "text", template = '''{
  "numStartups": {{startups}},
  "installMethod": "native",
  "autoUpdates": true,
  "theme": "dark",
  "userID": "{{user_id}}",
  "hasCompletedOnboarding": true,
  "oauthAccount": {
    "accountUuid": "{{account}}",
    "emailAddress": "{{email}}",
    "organizationUuid": "{{org}}",
    "organizationRole": "admin"
  },
  "mcpServers": { {{@mcp_servers_json}}
  },
  "projects": {}
}
''' }

[[decoy]]
id = "codex-auth"
category = "ai_agent"
description = "OpenAI Codex CLI auth (~/.codex/auth.json)"
targets = [
  '%USERPROFILE%\.codex\auth.json',
  '%USERPROFILE%\.codex\auth.json.bak',
  '%USERPROFILE%\.codex-old\auth.json',
]
installed_if = ['%USERPROFILE%\.codex\auth.json']
fields = { api_key = "openai_api_key", id_token = "jwt", access_token = "jwt", refresh = "openai_refresh_token", account = "uuid", refreshed = "date_past:1:20" }
plausibility = { age_days = [1, 20] }
content = { kind = "text", template = '''{
  "OPENAI_API_KEY": "{{api_key}}",
  "tokens": {
    "id_token": "{{id_token}}",
    "access_token": "{{access_token}}",
    "refresh_token": "{{refresh}}",
    "account_id": "{{account}}"
  },
  "last_refresh": "{{refreshed}}"
}
''' }

[[decoy]]
id = "cursor-state"
category = "ai_agent"
description = "Cursor global state database with session tokens (state.vscdb)"
targets = [
  '%APPDATA%\Cursor\User\globalStorage\state.vscdb',
  '%APPDATA%\Cursor\User\globalStorage\state.vscdb.backup',
  '%APPDATA%\Cursor.old\User\globalStorage\state.vscdb',
]
installed_if = ['%APPDATA%\Cursor\User\globalStorage\state.vscdb']
fields = { access = "jwt", refresh = "jwt", email = "email" }
plausibility = { age_days = [1, 15] }
content = { kind = "sqlite", shape = "vscode_state", rows = [
  { key = "cursorAuth/accessToken", value = "{{access}}" },
  { key = "cursorAuth/refreshToken", value = "{{refresh}}" },
  { key = "cursorAuth/cachedEmail", value = "{{email}}" },
  { key = "cursorAuth/cachedSignUpType", value = "Auth_0" },
  { key = "cursorAuth/stripeMembershipType", value = "pro" },
] }

[[decoy]]
id = "windsurf-state"
category = "ai_agent"
description = "Windsurf global state database with the Codeium API key (state.vscdb)"
targets = [
  '%APPDATA%\Windsurf\User\globalStorage\state.vscdb',
